name: uv lock file maintenance

on:
  pull_request:
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    # This job commits with GH_PAT, so it only works where that secret and a
    # branch to push to both exist. Fork pull requests have neither. Dependabot
    # branches do live here, but Dependabot-triggered runs read their secrets
    # from a separate store, so GH_PAT would be empty — hence the second check.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          # On pull_request, checkout defaults to the detached merge commit.
          # git-auto-commit-action needs the actual branch to commit onto, and
          # errors out on a detached HEAD since v6.
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: "Run uv lock command"
        run: uv lock

      - uses: stefanzweifel/git-auto-commit-action@v7
        id: auto-commit-action
        with:
          commit_message: Regenerate uv.lock

      - name: "Run if changes have been detected"
        if: steps.auto-commit-action.outputs.changes_detected == 'true'
        run: echo "Changes!"

      - name: "Run if no changes have been detected"
        if: steps.auto-commit-action.outputs.changes_detected == 'false'
        run: echo "No Changes!"