name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        # --locked fails when uv.lock no longer matches pyproject.toml, which
        # doubles as the lockfile check the pull request workflows lack
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync pytest -v

  ruff:
    name: Ruff ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # check and format are separate so a failure names which one
        command: ["check", "format --check"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Run ruff ${{ matrix.command }}
        run: uv run --no-sync ruff ${{ matrix.command }} .
