[project]
name = "audible-cli-webui"
version = "0.1.0"
description = "Multi-tenant web UI for importing an Audible library into Audiobookshelf."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "audible-cli",
    "audible[cryptography]>=0.12.0,<0.13",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "authlib>=1.3,<2",
    "httpx>=0.27.2,<0.29",
    "cryptography>=43",
    "pydantic-settings>=2.5,<3",
    "aiofiles>=25.1.0",
    "itsdangerous>=2.2,<3",
]

[tool.uv.sources]
audible-cli = { path = "../", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audible_cli_webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
